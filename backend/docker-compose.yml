services:
  postgres:
    image: postgres:16-alpine
    container_name: margin-trading-auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: margin_trading
    ports:
      - "5432:5432"
    volumes:
      - margin_trading_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d margin_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  margin_trading_postgres_data:
